name: Copilot Analytics Daily Sync & Pages Deploy

on:
  schedule:
    # 毎日 UTC 00:00 (JST 09:00) に自動更新
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mock_mode:
        description: 'Run with 2026.09 simulated mock data'
        required: false
        type: boolean
        default: false

permissions:
  contents: write      # copilot-data 独立ブランチへのデータ蓄積コミット用
  pages: write         # GitHub Pages へのデプロイ用
  id-token: write      # GitHub Pages OIDCトークン用

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  analyze-and-deploy:
    # Downstream forks that mirror this repository sometimes intentionally keep
    # `main` as a permanently deploy-inert, fast-forward-only mirror of upstream
    # (see SDD-12 Section 2.2 "Dual-Branch Strategy"), retargeting the actual
    # scheduled/CI-deploy pipeline to their own customization branch instead.
    # Without this guard, every `main` push in such a fork (including routine
    # upstream fast-forward syncs) would still trigger this job under that
    # fork's own repository, which fails immediately with "Branch \"main\" is
    # not allowed to deploy to github-pages due to environment protection
    # rules." if that fork's `github-pages` environment only allows its
    # customization branch to deploy (as SDD-12 Section 2.3 recommends). This
    # repository-identity check keeps the job a clean no-op (skipped, not
    # failed) anywhere other than the canonical upstream repository, with zero
    # effect on this repository's own runs.
    if: github.repository == 'sun-flat-yamada/github-copilot-dashboard'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # モックモード判定とデータ保存先ブランチを一元管理する。
      # モックデータ(ダミーデータ)は実データの copilot-data ブランチとは
      # 完全に分離された copilot-data-mock ブランチにのみ保存し、
      # 実データの履歴・Pagesデプロイに一切影響を与えないようにする。
      #
      # 注意: workflow_dispatch の boolean 型 input (inputs.mock_mode) は
      # GitHub Actions 式評価上「真の boolean」であり、文字列 'true' と
      # `==` 比較すると型不一致で常に false になる既知の罠がある
      # (boolean は数値へ、'true' は数値変換できず NaN となり NaN 比較は常に false)。
      # そのため boolean/string どちらの型でも正しく判定できるよう、
      # 両方の等価比較を明示的に OR で連結する。
      MOCK_MODE: ${{ (inputs.mock_mode == true || inputs.mock_mode == 'true' || vars.MOCK_MODE == 'true') && 'true' || 'false' }}
      DATA_BRANCH: ${{ (inputs.mock_mode == true || inputs.mock_mode == 'true' || vars.MOCK_MODE == 'true') && 'copilot-data-mock' || 'copilot-data' }}
    steps:
      - name: Checkout main code branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore previous data from data branch
        # モックモードは MockDataGenerator が毎回全量を再生成するため、
        # 過去データの復元は不要 (copilot-data-mock の履歴も参照しない)
        if: env.MOCK_MODE != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH"; then
            echo "Fetching existing $DATA_BRANCH branch..."
            git fetch origin "$DATA_BRANCH"
            # git archive を用いてインデックスや作業ツリーのブランチを一切変更せずに安全展開
            git archive "origin/$DATA_BRANCH" data | tar -x || true
            echo "✅ Successfully restored existing data partitions from $DATA_BRANCH."
          else
            echo "ℹ️ No $DATA_BRANCH branch found on remote. Will initialize upon first sync."
          fi

      - name: Decrypt large User Mapping (optional GPG >48KB workaround)
        # COPILOT_USER_MAPPING (Secret/Variable) は 48KB のサイズ上限があるため、
        # それを超えるマッピングを扱う場合のオプション機構。
        # data/config/copilot-user-mapping.json.gpg (copilot-data ブランチにのみ保管、
        # 直前のステップで data/ ごと復元済み) と COPILOT_USER_MAPPING_PASSPHRASE Secret が
        # 両方揃っている場合のみ有効化される。復号結果は $RUNNER_TEMP (ランナー破棄時に
        # 消える一時領域) にのみ書き出し、data/ 配下やリポジトリには一切保存しない
        # (平文PIIの誤コミット防止)。詳細: docs/specifications/04_user_attribute_mapping_spec.md
        if: env.MOCK_MODE != 'true'
        env:
          COPILOT_USER_MAPPING_PASSPHRASE: ${{ secrets.COPILOT_USER_MAPPING_PASSPHRASE }}
        run: |
          ENCRYPTED_FILE="data/config/copilot-user-mapping.json.gpg"
          if [ -f "$ENCRYPTED_FILE" ] && [ -n "$COPILOT_USER_MAPPING_PASSPHRASE" ]; then
            echo "🔐 Found GPG-encrypted user mapping ($ENCRYPTED_FILE). Decrypting (>48KB workaround)..."
            DECRYPTED_PATH="$RUNNER_TEMP/copilot-user-mapping.json"
            npx tsx scripts/decrypt-user-mapping.ts "$ENCRYPTED_FILE" "$DECRYPTED_PATH" --passphrase-env COPILOT_USER_MAPPING_PASSPHRASE
            echo "COPILOT_USER_MAPPING_FILE=$DECRYPTED_PATH" >> "$GITHUB_ENV"
            echo "✅ Large user mapping decrypted to a runner-local temp path (never committed)."
          elif [ -f "$ENCRYPTED_FILE" ]; then
            echo "⚠️ $ENCRYPTED_FILE was found but COPILOT_USER_MAPPING_PASSPHRASE secret is not set. Skipping decryption; falling back to COPILOT_USER_MAPPING variable/secret if configured."
          else
            echo "ℹ️ No GPG-encrypted user mapping found at $ENCRYPTED_FILE. Using COPILOT_USER_MAPPING variable/secret if configured."
          fi

      - name: Run Copilot Analytics Pipeline
        env:
          COPILOT_READ_TOKEN: ${{ secrets.COPILOT_READ_TOKEN }}
          COPILOT_ENTERPRISE: ${{ vars.COPILOT_ENTERPRISE }}
          COPILOT_ORGS: ${{ vars.COPILOT_ORGS }}
          COPILOT_USER_MAPPING: ${{ vars.COPILOT_USER_MAPPING || secrets.COPILOT_USER_MAPPING }}
          COPILOT_USER_MAPPING_FILE: ${{ env.COPILOT_USER_MAPPING_FILE }}
          COPILOT_COST_CENTER_BUDGETS: ${{ vars.COPILOT_COST_CENTER_BUDGETS || secrets.COPILOT_COST_CENTER_BUDGETS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: npm run pipeline:run

      - name: Commit and Push to data branch (Fork-Safe Storage)
        run: |
          # コードブランチには一切触れず、独立した一時リポジトリディレクトリで data ブランチを操作
          DATA_WORK_DIR=$(mktemp -d)
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if [ "$MOCK_MODE" = "true" ]; then
            # モックデータは実行のたびに MockDataGenerator が全量を再生成するため、
            # 過去のモック履歴を保持する意味がない。copilot-data-mock を都度
            # force-push でリセットし、ブランチ肥大化 (Phase 1で判明した問題) を防止する。
            echo "Mock mode: resetting orphan $DATA_BRANCH branch (no history accumulation)..."
            git init "$DATA_WORK_DIR"
            cd "$DATA_WORK_DIR"
            git checkout --orphan "$DATA_BRANCH"
            git remote add origin "$REPO_URL"
            cd "$GITHUB_WORKSPACE"

            mkdir -p "$DATA_WORK_DIR/data"
            cp -r data/* "$DATA_WORK_DIR/data/"

            cd "$DATA_WORK_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(mock-data): regenerate simulated Copilot analytics dataset $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push --force origin "$DATA_BRANCH"
            echo "✅ Successfully reset simulated dataset on $DATA_BRANCH branch."
          else
            if git ls-remote --exit-code --heads origin "$DATA_BRANCH"; then
              echo "Cloning existing $DATA_BRANCH branch into isolated work directory..."
              git clone --branch "$DATA_BRANCH" --single-branch --depth 1 "$REPO_URL" "$DATA_WORK_DIR"
            else
              echo "Initializing new orphan $DATA_BRANCH branch in isolated work directory..."
              git init "$DATA_WORK_DIR"
              cd "$DATA_WORK_DIR"
              git checkout --orphan "$DATA_BRANCH"
              git remote add origin "$REPO_URL"
              cd "$GITHUB_WORKSPACE"
            fi

            # 最新の data/ を同期
            mkdir -p "$DATA_WORK_DIR/data"
            cp -r data/* "$DATA_WORK_DIR/data/"

            cd "$DATA_WORK_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            if git status --porcelain | grep -q 'data/'; then
              git commit -m "chore(data): record copilot analytics partitions $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
              git push origin "$DATA_BRANCH"
              echo "✅ Successfully synced partitions to $DATA_BRANCH branch."
            else
              echo "ℹ️ No changes in data partitions to commit."
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          rm -rf "$DATA_WORK_DIR"

      # 以下のビルド・デプロイ工程は実データ運用時のみ実行する。
      # モックモードは copilot-data-mock への検証用データ生成に留め、
      # 本番の GitHub Pages には一切反映させない (実運用化の徹底)。
      - name: Update AI Model Benchmarks Dataset
        if: env.MOCK_MODE != 'true'
        run: npm run benchmark:update

      - name: Stage DEMO Partitions for GitHub Pages
        if: env.MOCK_MODE != 'true'
        run: |
          if [ -d "data/demo" ]; then
            echo "📦 Staging DEMO partition into dashboard/public/data/demo for GitHub Pages deployment..."
            mkdir -p dashboard/public/data/demo
            # 1. ルート直下のメタデータ (index.json, error-log.json等) をコピー
            cp -r data/demo/* dashboard/public/data/demo/
            # 2. 永続ストレージの processed/* を SPA 公開パスのルート直下にも展開 (二重防護)
            if [ -d "data/demo/processed" ]; then
              cp -r data/demo/processed/* dashboard/public/data/demo/
            fi
            echo "✅ DEMO partitions successfully staged (both root and processed compatibility paths)."
          else
            echo "ℹ️ No data/demo directory found to stage."
          fi

      - name: Build Dashboard SPA
        if: env.MOCK_MODE != 'true'
        env:
          BASE_URL: './'
        run: npm run build

      - name: Setup Pages
        if: env.MOCK_MODE != 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        if: env.MOCK_MODE != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: env.MOCK_MODE != 'true'
        id: deployment
        uses: actions/deploy-pages@v5
