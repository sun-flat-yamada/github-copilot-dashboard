name: CI Verification & Build Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test, Pipeline & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Secret & Privacy Scan
        run: npm run secret-scan

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Verify Pipeline execution (Mock Mode)
        env:
          MOCK_MODE: 'true'
          GITHUB_REPOSITORY: 'owner/github-copilot-dashboard'
          GITHUB_REPOSITORY_OWNER: 'owner'
        run: npm run pipeline:mock

      - name: Build Dashboard SPA
        run: npm run build
